[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-local-client"
version = "0.1.0"
description = "Importable classifier and local HTTP API for restored Laya models"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "laya==0.3.22",
    "transformers==4.57.6",
    "huggingface-hub==0.36.0",
    "safetensors==0.6.2",
    "numpy==2.2.6",
]

[tool.setuptools]
py-modules = ["laya_client", "laya_api"]
